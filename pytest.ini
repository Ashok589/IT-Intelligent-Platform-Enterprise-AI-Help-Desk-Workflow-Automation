[pytest]
# =========================================================
# PYTEST CONFIGURATION
# Enterprise IT Intelligence Platform
# =========================================================

# Test directories
testpaths = tests

# Output verbosity
addopts =
    --tb=short
    --strict-markers
    -q

# Custom markers
markers =
    slow: marks tests as slow (skipped in quick mode)
    integration: marks tests as integration tests requiring LLM
    smoke: marks tests as smoke tests (fast, no external calls)

# Minimum Python version
minversion = 7.0

# Ignore deprecation warnings from third-party libraries
filterwarnings =
    ignore::DeprecationWarning:langchain.*:
    ignore::DeprecationWarning:chromadb.*:
    ignore::UserWarning:sentence_transformers.*:
    ignore::FutureWarning:
